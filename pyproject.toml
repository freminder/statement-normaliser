[project]
name = "statement-normaliser"
version = "0.1.0"
description = "Normalise broker statement CSVs into a single canonical schema."
readme = "README.md"
requires-python = ">=3.12"
# Standard library only, on purpose. See README: the point of this project is
# to understand what pandas does for you before you let it do it.
dependencies = []

[project.scripts]
normalise = "statement_normaliser.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statement_normaliser"]

# ─── Ruff: lint + format, replaces flake8 + isort + black ────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming conventions
    "UP",       # pyupgrade — modern syntax
    "B",        # bugbear — likely bugs
    "SIM",      # simplifiable code
    "D",        # docstrings
    "ANN",      # missing type annotations
    "PL",       # pylint subset
    "RUF",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Tests do not need module/class docstrings on every item, and their names
# are the documentation.
"tests/*" = ["D100", "D103", "ANN201", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ─── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Strict on source only. Test files use untyped pytest decorators, and
# fighting mypy over @parametrize buys you nothing — the tests are the check.
files = ["src"]

# ─── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
# Not 100. Chasing the last 20% drives you to test getters instead of edges.
fail_under = 80
